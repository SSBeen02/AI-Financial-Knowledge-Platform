<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나의 경세학당 · 학습노트</title>
<style>
:root{font-family:'Malgun Gothic',sans-serif;color:#302d24;background:#f6f1e6;--green:#527345;--line:#d5cab5}*{box-sizing:border-box}body{margin:0}header{background:#fffcf5;border-bottom:3px double #9b8968;padding:20px 5%;display:flex;justify-content:space-between;align-items:center}header strong{font-size:24px}header span{color:var(--green)}main{max-width:1320px;margin:30px auto;padding:0 24px}h1{margin:0;font-size:30px}p{line-height:1.8}small,.muted{color:#756f60}.intro{display:flex;align-items:baseline;gap:22px}.toolbar{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:24px 0}button,select,a.action{font:inherit;border:1px solid var(--line);border-radius:9px;background:#fffcf5;padding:12px 20px;color:inherit;cursor:pointer}button:hover{border-color:var(--green)}button:focus-visible,select:focus-visible{outline:3px solid #638b50;outline-offset:3px}button:disabled{opacity:.5;cursor:default}.filters{display:flex;gap:8px}.active{background:#dce8cf!important;border-color:#6b8b54!important}#status{min-height:25px;font-size:14px}.layout{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}aside,article{background:#fffcf7;border:3px double #a59576;border-radius:12px;padding:22px}aside h2{margin:0 0 20px;font-size:20px}.concept{width:100%;text-align:left;margin-bottom:10px;padding:18px 16px;display:grid;gap:8px}.concept strong{font-size:19px}.concept small{font-size:13px}.detail-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.detail-head h2{margin:0}.badge{display:inline-block;padding:5px 12px;background:#e8efdf;border:1px solid #b8cba6;border-radius:20px;font-size:13px}.tabs{display:flex;gap:8px;flex-wrap:wrap;padding:22px 0;border-bottom:1px solid var(--line)}.tabs button{font-size:14px;padding:10px 14px}.prompt{font-size:21px;line-height:1.7;margin:24px 0 18px}.choices{display:grid;gap:10px}.choice{padding:12px 16px;background:#f7f5ef;border:1px solid var(--line);border-radius:9px;line-height:1.6}.choice.right{background:#eaf2e2;border-color:#9db68a}.choice.wrong{background:#faece6;border-color:#d6a39b}.marker{float:right;font-size:13px;font-weight:bold;margin-left:10px}.section{padding-top:20px;margin-top:20px;border-top:1px solid var(--line)}h3{font-size:18px;margin:0 0 10px}.explanation{margin:0;line-height:1.9}.review-row{padding:10px 14px;margin-bottom:8px;background:#f3f1e9;border-radius:8px;font-size:14px}.actions{display:flex;gap:12px;margin-top:22px}.actions button{flex:1;font-weight:bold}.primary{background:var(--green);color:white}.notice{font-size:13px;color:#756f60}.retry-choices{display:grid;gap:8px;margin:14px 0}.retry-choices button{text-align:left}footer{display:flex;align-items:center;gap:14px;margin:24px 0}a{color:var(--green)}#review-message{min-height:24px}#error{color:#9b3930}.empty{padding:35px 0;color:#756f60}@media(max-width:760px){.layout{grid-template-columns:1fr}.intro{display:block}.filters{flex-wrap:wrap}.actions{flex-direction:column}header strong{font-size:19px}main{padding:0 14px}.detail-head{align-items:start;flex-direction:column}}
</style></head><body>
<header><strong>나의 경세학당</strong><span>📖 학습노트</span></header>
<main><div class="intro"><h1>나의 학습노트</h1><p>배운 개념과 풀이 기록을 돌아봐요.</p></div>
<div class="toolbar"><nav class="filters" aria-label="풀이 필터"><button data-filter="all" class="active" aria-pressed="true">전체 풀이</button><button data-filter="wrong" aria-pressed="false">오답노트</button><button data-filter="correct" aria-pressed="false">정답 기록</button></nav><select id="stage" aria-label="스테이지"><option value="stage1" selected>Stage 1</option><option value="stage2">Stage 2</option><option value="stage3">Stage 3</option><option value="stage4">Stage 4</option><option value="stage5">Stage 5</option></select></div>
<div id="status" role="status"></div><div class="layout"><aside><h2 id="list-title">개념별 풀이 기록</h2><div id="list"></div></aside><article id="detail"><p>기록을 불러오는 중입니다.</p></article></div>
<footer><button id="prev">이전</button><span id="page"></span><button id="next">다음</button><a href="/">학습 화면으로</a></footer></main>
<script>
let filter='all',page=1,groups=[],selectedGroup='',selectedQuestion='',generation=0;let controller;
const $=s=>document.querySelector(s);
const node=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
const choiceLabel=c=>String(c.key).trim()===String(c.text).trim()?c.key:c.key+' · '+c.text;
const gkey=g=>g.concept_id;
const qkey=q=>JSON.stringify([q.submission_id,q.question_index]);
const format=t=>new Date(t).toLocaleString('ko-KR');
async function request(url,options={}){const headers=new Headers(options.headers||{});if(window.quizAccessTokenProvider){const token=await window.quizAccessTokenProvider();if(token)headers.set('Authorization','Bearer '+token)}const r=await fetch(url,{...options,headers});const b=await r.json();if(!r.ok)throw Error(b.message||'요청을 처리하지 못했습니다.');return b}
async function load(){const run=++generation;controller?.abort();controller=new AbortController();$('#status').textContent='기록을 불러오는 중…';$('#detail').replaceChildren(node('p','기록을 불러오는 중입니다.'));$('#list').replaceChildren();$('#prev').disabled=true;$('#next').disabled=true;
try{const q=new URLSearchParams({filter,page});if($('#stage').value)q.set('stage_id',$('#stage').value);const b=await request('/api/v1/learning-notes/concepts?'+q,{signal:controller.signal});if(run!==generation)return;if(!b.items.length&&page>1&&b.total){page=Math.ceil(b.total/b.page_size);return load()}groups=b.items;$('#status').textContent='총 '+b.total+'개 개념 · '+({all:'전체 풀이',wrong:'틀린 문항만',correct:'맞힌 문항만'}[filter]);$('#page').textContent=page+'페이지';$('#prev').disabled=page===1;$('#next').disabled=page*b.page_size>=b.total;$('#list-title').textContent={all:'개념별 풀이 기록',wrong:'개념별 오답 기록',correct:'개념별 정답 기록'}[filter];const g=groups.find(x=>gkey(x)===selectedGroup)||groups[0];if(g)selectGroup(g);else{$('#detail').replaceChildren(node('p','해당하는 풀이 기록이 없습니다.','empty'));$('#list').replaceChildren(node('p','기록이 없습니다.'))}}
catch(e){if(e.name==='AbortError'||run!==generation)return;$('#status').textContent=e.message;$('#detail').replaceChildren(node('p','기록을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.'));const retry=node('button','다시 불러오기');retry.onclick=load;$('#detail').append(retry)}}
function selectGroup(group){selectedGroup=gkey(group);$('#list').replaceChildren();for(const g of groups){const b=node('button',undefined,'concept'+(gkey(g)===selectedGroup?' active':''));b.setAttribute('aria-pressed',String(gkey(g)===selectedGroup));b.append(node('strong',g.term),node('small',g.stage_ids.map(s=>s||'단계 없음').join(' / ')+' · '+g.questions.length+'개 문항'),node('small',format(g.latest_at)));b.onclick=()=>{selectedQuestion='';selectGroup(g)};$('#list').append(b)}const q=group.questions.find(q=>qkey(q)===selectedQuestion)||group.questions[0];showQuestion(group,q)}
function showQuestion(g,q){selectedQuestion=qkey(q);const box=$('#detail');box.replaceChildren();const head=node('div',undefined,'detail-head');head.append(node('h2',g.term),node('span',q.stage_id||'단계 없음','badge'));box.append(head,node('p','현재 개념 상태: '+({not_started:'미학습',in_progress:'학습중',passed:'통과'}[q.concept_status]||'미연결'),'muted'));
const tabs=node('div',undefined,'tabs');tabs.setAttribute('role','tablist');tabs.setAttribute('aria-label','문항 전환');g.questions.forEach((item,i)=>{const repeated=g.questions.filter(x=>x.question_index===item.question_index).length>1;const title=(item.stage_id?item.stage_id+' · ':'')+'Q'+item.question_index+'. '+(item.question_type==='ox'?'OX':'상황형')+' '+(item.is_correct?'⭕':'❌')+(repeated?' · '+format(item.created_at):'');const b=node('button',title,qkey(item)===selectedQuestion?'active':'');b.setAttribute('role','tab');b.setAttribute('aria-selected',String(qkey(item)===selectedQuestion));b.setAttribute('aria-controls','question-panel');b.id='question-tab-'+i;b.onclick=()=>{showQuestion(g,item);document.getElementById(b.id)?.focus()};b.onkeydown=e=>{let n;if(e.key==='ArrowRight')n=(i+1)%g.questions.length;if(e.key==='ArrowLeft')n=(i-1+g.questions.length)%g.questions.length;if(e.key==='Home')n=0;if(e.key==='End')n=g.questions.length-1;if(n!==undefined){e.preventDefault();showQuestion(g,g.questions[n]);document.getElementById('question-tab-'+n)?.focus()}};tabs.append(b)});box.append(tabs);
const panel=node('section');panel.id='question-panel';panel.setAttribute('role','tabpanel');panel.setAttribute('aria-labelledby','question-tab-'+g.questions.indexOf(q));panel.append(node('h3',q.prompt,'prompt'));const choices=node('div',undefined,'choices');for(const c of q.choices){const div=node('div',choiceLabel(c),'choice'+(c.key===q.answer?' right':c.key===q.submitted_answer&&!q.is_correct?' wrong':''));const tags=[];if(c.key===q.submitted_answer)tags.push('내 답');if(c.key===q.answer)tags.push('정답');if(tags.length)div.append(node('span',tags.join(' · '),'marker'));choices.append(div)}panel.append(choices,node('p','최초 풀이 '+(q.is_correct?'정답':'오답')+' · '+format(q.created_at),'muted'));const explain=node('section',undefined,'section');explain.append(node('h3','📖 해설'),node('p',q.explanation,'explanation'));panel.append(explain);
const history=node('section',undefined,'section');history.id='history';renderHistory(history,q);panel.append(history);const actions=node('div',undefined,'actions');const retry=node('button','✎ 다시 풀기','primary');retry.onclick=()=>{const params=new URLSearchParams({mode:'review',concept_id:g.concept_id,stage_id:q.stage_id||'',submission_id:q.submission_id,question_index:q.question_index});location.assign('/quiz?'+params)};actions.append(retry);panel.append(actions,node('p','재풀이는 복습 기록에만 반영돼요. 최초 정오답과 학습 진행률은 바뀌지 않아요.','notice'));box.append(panel)}
function renderHistory(box,q){box.replaceChildren(node('h3','◷ 복습 기록'));if(!q.reviews.length)box.append(node('p','아직 재풀이 기록이 없어요.','muted'));const recent=q.reviews.map((r,i)=>({r,i})).sort((a,b)=>new Date(b.r.created_at)-new Date(a.r.created_at)||b.i-a.i).slice(0,5);for(const {r} of recent)box.append(node('div',(r.is_correct?'⭕ 정답':'❌ 오답')+' · 내 답 '+r.submitted_answer+' · '+format(r.created_at),'review-row'))}
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;page=1;selectedQuestion='';document.querySelectorAll('[data-filter]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b))});load()});$('#stage').onchange=()=>{page=1;selectedQuestion='';load()};$('#prev').onclick=()=>{page--;load()};$('#next').onclick=()=>{page++;load()};load();
</script></body></html>
