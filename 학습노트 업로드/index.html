<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>사전테스트 미니 테스트</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", sans-serif;
      background: #f4f1ea;
      color: #1d1a16;
    }
    body {
      max-width: 920px;
      margin: 0 auto;
      padding: 28px 20px 64px;
    }
    h1, h2, h3 { margin: 0 0 8px; }
    p { margin: 0; }
    a { color: #0b5f4a; }
    header p, .hint { color: #5c564e; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 20px 0 12px;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      background: #0b5f4a;
      color: white;
      font: inherit;
      cursor: pointer;
    }
    button:disabled,
    button.secondary:disabled {
      background: #c8c2b8;
      color: #6d675f;
      cursor: not-allowed;
    }
    button.secondary { background: #3d4a57; }
    #status {
      min-height: 1.4em;
      margin-bottom: 16px;
    }
    #status.error { color: #9d1c1c; }
    .card, .question {
      background: white;
      border: 1px solid #e4ddd2;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .meta { color: #5c564e; font-size: 14px; margin-bottom: 8px; }
    .options { display: grid; gap: 6px; margin-top: 10px; }
    label.option {
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }
    ul { margin: 8px 0 0; padding-left: 18px; }
    li + li { margin-top: 4px; }
    .score {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 0;
      border-bottom: 1px solid #eee7dc;
    }
    .vulnerable { color: #9d1c1c; }
    .progress {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      color: #5c564e;
      font-size: 14px;
    }
    .dots {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .dots button {
      width: 34px;
      height: 34px;
      padding: 0;
      background: #efeae2;
      color: #1d1a16;
    }
    .dots button.answered { box-shadow: inset 0 0 0 2px #0b5f4a; }
    .dots button.current { background: #0b5f4a; color: white; }
    .pager {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    .report-section { margin-top: 24px; }
    .report-intro { font-size: 17px; line-height: 1.8; margin: 12px 0; max-width: 70ch; }
    .domain-note, .answer-note { padding: 14px 0; border-bottom: 1px solid #eee7dc; }
    .domain-note p, .answer-note p { line-height: 1.8; margin-top: 8px; overflow-wrap: anywhere; }
    .domain-note h3, .answer-note h3 { font-size: 16px; }
    .answer-group { margin: 12px 0; padding: 12px 16px; border: 1px solid #e4ddd2; border-radius: 8px; }
    .answer-group summary { cursor: pointer; font-weight: 600; }
    .answer-options { color: #5c564e; font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <h1>사전테스트 미니 테스트</h1>
    <p class="hint">마지막 문제에서 결과 보기로 넘어가면 리포트가 만들어집니다. 생성이 실패하면 다시 생성 버튼으로 같은 채점 결과의 리포트를 요청합니다. 개념 확인 화면은 <a href="/quiz">/quiz</a>, API 문서는 <a href="/docs">/docs</a> 입니다.</p>
  </header>

  <div class="toolbar">
    <button id="start" type="button">1. 사전테스트 시작</button>
    <button id="fill" type="button" class="secondary" disabled>모두 1번 선택</button>
    <button id="submit" type="button" disabled>2. 답안 제출</button>
    <button id="load-report" type="button" class="secondary" disabled>3. 리포트 조회</button>
  </div>
  <p id="status"></p>
  <section id="questions"></section>
  <section id="result"></section>

  <script>
    const state = { diagnosticId: null, reportId: null, questions: [], submissionKey: null, reportStatus: "pending", answers: [], currentIndex: 0, phase: "questions" };
    let pollTimer = null;
    function saveState() { try { sessionStorage.setItem("pretest-state", JSON.stringify(state)); } catch {} }

    const startButton = document.querySelector("#start");
    const fillButton = document.querySelector("#fill");
    const submitButton = document.querySelector("#submit");
    const reportButton = document.querySelector("#load-report");
    const statusNode = document.querySelector("#status");
    const questionsNode = document.querySelector("#questions");
    const resultNode = document.querySelector("#result");

    questionsNode.addEventListener("change", (event) => {
      const input = event.target;
      if (!(input instanceof HTMLInputElement) || input.type !== "radio") return;
      const question = state.questions[state.currentIndex];
      if (!question) return;
      rememberAnswer(question.id, Number(input.value));
      saveState();
      renderCurrentQuestion();
    });
    startButton.addEventListener("click", startDiagnostic);
    fillButton.addEventListener("click", selectFirstOptions);
    submitButton.addEventListener("click", submitAnswers);
    reportButton.addEventListener("click", () => {
      if (state.reportStatus === "failed") retryReport();
      else loadReport();
    });

    function setStatus(message, isError) {
      statusNode.textContent = message;
      statusNode.classList.toggle("error", Boolean(isError));
    }

    async function startDiagnostic() {
      setBusy(true);
      setStatus("사전테스트를 시작하는 중입니다.");
      try {
        const body = await request("/diagnostics", { method: "POST" });
        state.diagnosticId = body.id;
        state.reportId = null;
        state.submissionKey = null;
        state.answers = [];
        state.currentIndex = 0;
        state.phase = "questions";
        state.reportStatus = "pending";
        clearTimeout(pollTimer);
        state.questions = body.questions;
        resultNode.replaceChildren();
        renderCurrentQuestion();
        saveState();
        setStatus(`진단 ${body.id} 이 시작되었습니다. 문항 ${body.total_questions}개, 사용자 ${body.user_id}`);
      } catch (error) {
        setStatus(error.message, true);
      } finally {
        setBusy(false);
      }
    }

    function selectFirstOptions() {
      state.answers = state.questions.map((question) => ({
        question_id: question.id,
        selected_answer: 1,
      }));
      saveState();
      renderCurrentQuestion();
      setStatus("모든 문항을 1번으로 선택했습니다.");
    }

    async function submitAnswers() {
      clearTimeout(pollTimer);
      const answers = collectAnswers();
      if (answers.length !== state.questions.length) {
        const missingIndex = state.questions.findIndex((question) => !answerFor(question.id));
        if (missingIndex >= 0) showQuestion(missingIndex);
        setStatus("모든 문항에 보기를 선택한 뒤 제출해 주세요.", true);
        return;
      }
      showReportPage("답안을 제출하고 리포트를 만드는 중입니다.");
      setBusy(true);
      state.submissionKey ||= crypto.randomUUID();
      saveState();
      setStatus("답안을 제출하는 중입니다.");
      try {
        const body = await request(`/diagnostics/${state.diagnosticId}/submit`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Idempotency-Key": state.submissionKey },
          body: JSON.stringify({ answers }),
        });
        state.reportId = body.report_id;
        state.reportStatus = body.status;
        saveState();
        renderSubmitResult(body);
        setStatus(`답안이 접수되었습니다. 리포트 상태: ${body.status}`);
        if (body.status === "processing") pollTimer = setTimeout(loadReport, 1500);
      } catch (error) {
        setStatus(error.message, true);
        try {
          const report = await request(`/reports/${state.diagnosticId}`);
          state.reportStatus = report.status;
          if (report.status !== "pending") {
            state.reportId = report.id;
            renderReport(report);
            if (report.status === "processing") pollTimer = setTimeout(loadReport, 1500);
          }
          saveState();
        } catch {}
      } finally {
        setBusy(false);
      }
    }

    async function finishTest() {
      const current = state.questions[state.currentIndex];
      if (current && !answerFor(current.id)) {
        setStatus("이 문항의 보기를 선택한 뒤 결과 페이지로 이동해 주세요.", true);
        return;
      }
      const missingIndex = state.questions.findIndex((question) => !answerFor(question.id));
      if (missingIndex >= 0) {
        showQuestion(missingIndex);
        setStatus("모든 문항에 보기를 선택한 뒤 결과 페이지로 이동해 주세요.", true);
        return;
      }
      if (state.reportStatus === "pending" && !state.reportId) {
        await submitAnswers();
        return;
      }
      showReportPage("리포트 페이지로 이동합니다.");
      await loadReport();
    }

    async function retryReport() {
      clearTimeout(pollTimer);
      showReportPage("리포트를 다시 생성하는 중입니다.");
      setBusy(true);
      try {
        const body = await request(`/reports/${state.diagnosticId}/retry`, { method: "POST" });
        applyReport(body);
        if (body.status === "processing") pollTimer = setTimeout(loadReport, 1500);
        setStatus(body.status === "failed" ? "리포트 생성에 실패했습니다. 다시 생성 버튼을 눌러 주세요." : `리포트 상태: ${body.status}`, body.status === "failed");
      } catch (error) {
        setStatus(error.message, true);
      } finally {
        setBusy(false);
      }
    }

    async function loadReport() {
      clearTimeout(pollTimer);
      if (state.phase !== "report") showReportPage("리포트를 조회하는 중입니다.");
      setBusy(true);
      setStatus("리포트를 조회하는 중입니다.");
      try {
        const body = await request(`/reports/${state.diagnosticId}`);
        applyReport(body);
        if (body.status === "processing") pollTimer = setTimeout(loadReport, 1500);
        setStatus(
          body.status === "failed"
            ? "리포트 생성에 실패했습니다. 다시 생성 버튼을 눌러 주세요."
            : `리포트 ${body.id} 를 불러왔습니다. 상태 ${body.status}`,
          body.status === "failed"
        );
      } catch (error) {
        setStatus(error.message, true);
      } finally {
        setBusy(false);
      }
    }

    function showReportPage(message) {
      state.phase = "report";
      questionsNode.replaceChildren();
      saveState();
      if (message) setStatus(message);
      const section = document.createElement("section");
      section.className = "card";
      section.append(heading("리포트"), paragraph(message || "리포트를 준비하고 있습니다."));
      resultNode.replaceChildren(section);
      resultNode.scrollIntoView({ block: "nearest" });
    }

    function applyReport(body) {
      state.reportStatus = body.status;
      if (body.status !== "pending") state.reportId = body.id;
      state.phase = "report";
      questionsNode.replaceChildren();
      saveState();
      renderReport(body);
    }

    function answerFor(questionId) {
      return state.answers.find((answer) => answer.question_id === questionId) || null;
    }

    function rememberAnswer(questionId, selectedAnswer) {
      const existing = answerFor(questionId);
      if (existing) existing.selected_answer = selectedAnswer;
      else state.answers.push({ question_id: questionId, selected_answer: selectedAnswer });
    }

    function collectAnswers() {
      const answers = [];
      for (const question of state.questions) {
        const saved = answerFor(question.id);
        if (!saved) continue;
        answers.push({
          question_id: question.id,
          selected_answer: saved.selected_answer,
        });
      }
      return answers;
    }

    function showQuestion(index) {
      state.currentIndex = index;
      saveState();
      renderCurrentQuestion();
      questionsNode.scrollIntoView({ block: "nearest" });
    }

    function renderCurrentQuestion() {
      questionsNode.replaceChildren();
      const questions = state.questions;
      if (questions.length === 0) return;
      if (state.currentIndex < 0 || state.currentIndex >= questions.length) state.currentIndex = 0;
      const index = state.currentIndex;
      const question = questions[index];
      const saved = answerFor(question.id);

      const progress = document.createElement("div");
      progress.className = "progress";
      const position = document.createElement("span");
      position.textContent = `${index + 1} / ${questions.length}`;
      const answered = document.createElement("span");
      answered.textContent = `답한 문항 ${collectAnswers().length}개`;
      progress.append(position, answered);

      const dots = document.createElement("div");
      dots.className = "dots";
      questions.forEach((item, dotIndex) => {
        const dot = document.createElement("button");
        dot.type = "button";
        dot.textContent = String(dotIndex + 1);
        dot.classList.toggle("current", dotIndex === index);
        dot.classList.toggle("answered", Boolean(answerFor(item.id)));
        dot.setAttribute("aria-label", `${dotIndex + 1}번 문항`);
        dot.addEventListener("click", () => showQuestion(dotIndex));
        dots.append(dot);
      });

      const article = document.createElement("article");
      article.className = "question";
      const meta = document.createElement("p");
      meta.className = "meta";
      meta.textContent = `${index + 1}. ${question.domain_label} · 난이도 ${question.difficulty}`;
      const title = document.createElement("h2");
      title.textContent = question.question;
      const options = document.createElement("div");
      options.className = "options";
      question.options.forEach((option, optionIndex) => {
        const label = document.createElement("label");
        label.className = "option";
        const input = document.createElement("input");
        input.type = "radio";
        input.name = cssName(question.id);
        input.value = String(optionIndex + 1);
        input.checked = saved?.selected_answer === optionIndex + 1;
        label.append(input, document.createTextNode(option));
        options.append(label);
      });

      const pager = document.createElement("div");
      pager.className = "pager";
      const previous = document.createElement("button");
      previous.id = "prev";
      previous.type = "button";
      previous.className = "secondary";
      previous.textContent = "이전 문제";
      previous.disabled = index === 0;
      previous.addEventListener("click", () => showQuestion(index - 1));
      const next = document.createElement("button");
      next.id = "next";
      next.type = "button";
      const isLast = index === questions.length - 1;
      next.textContent = isLast ? "결과 보기" : "다음 문제";
      next.addEventListener("click", () => {
        if (isLast) finishTest();
        else showQuestion(index + 1);
      });
      pager.append(previous, next);

      article.append(meta, title, options, pager);
      questionsNode.append(progress, dots, article);
    }

    function renderSubmitResult(body) {
      const section = document.createElement("section");
      section.className = "card";
      const title = document.createElement("h2");
      title.textContent = "채점 결과";
      const summary = document.createElement("p");
      summary.textContent = `${body.summary.correct_count}/${body.summary.total_questions}문항, ${body.summary.score}점, ${body.summary.level}`;
      section.append(title, summary, scoreList(body.domain_scores));
      resultNode.replaceChildren(section);
    }

    function renderReport(body) {
      const llm = body.llm_report;
      const section = document.createElement("section");
      section.className = "card";
      if (!llm) {
        section.append(
          heading("리포트"),
          paragraph(body.status === "processing"
            ? "리포트를 만들고 있습니다. 잠시만 기다려 주세요."
            : `상태 ${body.status} · 사용자 ${body.user_id}`)
        );
        if (body.domain_scores) section.append(scoreList(body.domain_scores));
        if (body.error) section.append(paragraph(body.error.message));
        if (body.status === "failed") section.append(retryButton());
        resultNode.replaceChildren(section);
        return;
      }
      section.append(heading("사전테스트 리포트"));
      const intro = paragraph(llm.level_diagnosis.summary);
      intro.className = "report-intro";
      section.append(paragraph(`이번 테스트: ${body.summary?.score ?? "-"}점 · ${llm.level_diagnosis.overall_level}`), intro);
      const scores = document.createElement("section");
      scores.className = "report-section";
      scores.append(heading("영역별 결과", 3), scoreList(body.domain_scores || []));
      for (const item of llm.level_diagnosis.domain_comments) {
        const note = document.createElement("article");
        note.className = "domain-note";
        note.append(heading(item.domain_label, 3), paragraph(item.diagnosis));
        scores.append(note);
      }
      section.append(scores);
      const wrongSection = document.createElement("section");
      wrongSection.className = "report-section";
      wrongSection.append(heading("선택한 답과 정답의 차이", 3), paragraph(llm.wrong_answer_analysis.summary));
      const resultById = new Map((body.question_results || []).map(item => [item.question_id, item]));
      const groups = new Map();
      for (const item of llm.wrong_answer_analysis.items) {
        if (!groups.has(item.domain)) groups.set(item.domain, { label: item.domain_label, items: [] });
        groups.get(item.domain).items.push(item);
      }
      for (const group of groups.values()) {
        const details = document.createElement("details");
        details.className = "answer-group";
        details.open = llm.wrong_answer_analysis.items.length <= 6;
        const summary = document.createElement("summary");
        summary.textContent = `${group.label} · 오답 ${group.items.length}개`;
        details.append(summary);
        for (const item of group.items) {
          const note = document.createElement("article");
          note.className = "answer-note";
          note.append(heading(item.concept, 3));
          const result = resultById.get(item.question_id);
          if (result) {
            const options = paragraph(`선택: ${result.options[result.selected_answer - 1]} / 정답: ${result.options[result.correct_answer - 1]}`);
            options.className = "answer-options";
            note.append(options);
          }
          note.append(paragraph(item.vulnerability));
          details.append(note);
        }
        wrongSection.append(details);
      }
      section.append(wrongSection);
      const learning = document.createElement("section");
      learning.className = "report-section";
      learning.append(heading("학습 권장", 3));
      for (const item of llm.recommendations) {
        const note = document.createElement("article");
        note.className = "domain-note";
        note.append(heading(`${item.priority}. ${item.focus}`, 3));
        note.append(paragraph(item.guide));
        learning.append(note);
      }
      section.append(learning);
      resultNode.replaceChildren(section);
    }

    function retryButton() {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = "리포트 다시 생성";
      button.addEventListener("click", retryReport);
      return button;
    }

    function scoreList(rows) {
      const list = document.createElement("div");
      for (const row of rows) {
        const line = document.createElement("div");
        line.className = "score";
        const name = document.createElement("span");
        name.textContent = row.domain_label;
        const score = document.createElement("span");
        score.textContent = row.is_vulnerable ? `${row.score}점 · 취약` : `${row.score}점`;
        score.classList.toggle("vulnerable", row.is_vulnerable);
        line.append(name, score);
        list.append(line);
      }
      return list;
    }

    function heading(text, level = 2) {
      const node = document.createElement(level === 3 ? "h3" : "h2");
      node.textContent = text;
      return node;
    }

    function paragraph(text) {
      const node = document.createElement("p");
      node.textContent = text;
      return node;
    }

    function textList(lines) {
      const list = document.createElement("ul");
      if (lines.length === 0) {
        const item = document.createElement("li");
        item.textContent = "없음";
        list.append(item);
        return list;
      }
      for (const line of lines) {
        const item = document.createElement("li");
        item.textContent = line;
        list.append(item);
      }
      return list;
    }

    function cssName(questionId) {
      return `q-${questionId}`;
    }

    function setBusy(isBusy) {
      startButton.disabled = isBusy;
      fillButton.disabled = isBusy || state.questions.length === 0;
      submitButton.disabled = isBusy || state.questions.length === 0 || Boolean(state.reportId) || state.reportStatus !== "pending";
      reportButton.disabled = isBusy || !state.diagnosticId;
      reportButton.textContent = state.reportStatus === "failed" ? "리포트 다시 생성" : "3. 리포트 조회";
      for (const button of questionsNode.querySelectorAll(".dots button, #retry-report")) {
        button.disabled = isBusy;
      }
      const previous = questionsNode.querySelector("#prev");
      const next = questionsNode.querySelector("#next");
      if (previous) previous.disabled = isBusy || state.currentIndex <= 0;
      if (next) next.disabled = isBusy;
      const retry = resultNode.querySelector("button");
      if (retry) retry.disabled = isBusy;
    }

    async function request(path, options) {
      const response = await fetch(path, options);
      const body = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(errorMessage(body, response.status));
      }
      return body;
    }

    function errorMessage(body, status) {
      if (typeof body.message === "string" && body.message) return body.message;
      const detail = body.detail;
      if (typeof detail === "string") return detail;
      if (detail && typeof detail === "object") return detail.message || JSON.stringify(detail);
      return `요청에 실패했습니다. (${status})`;
    }
    try {
      const saved = JSON.parse(sessionStorage.getItem("pretest-state") || "null");
      if (saved && saved.diagnosticId && Array.isArray(saved.questions)) {
        Object.assign(state, saved);
        if (!Number.isInteger(state.currentIndex)) state.currentIndex = 0;
        if (state.phase !== "questions" && state.phase !== "report") state.phase = "questions";
        if (state.reportStatus && state.reportStatus !== "pending") state.phase = "report";
        if (state.phase === "report") {
          questionsNode.replaceChildren();
          setBusy(false);
          loadReport();
        } else {
          renderCurrentQuestion();
          setBusy(false);
        }
      }
    } catch { sessionStorage.removeItem("pretest-state"); }
  </script>
</body>
</html>
