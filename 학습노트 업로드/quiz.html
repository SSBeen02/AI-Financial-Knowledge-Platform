<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>개념 확인</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", sans-serif;
      background: #f4f1ea;
      color: #1d1a16;
    }
    body {
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 20px 72px;
    }
    h1, h2 { margin: 0 0 8px; }
    p { margin: 0; }
    a { color: #0b5f4a; }
    header p { color: #5c564e; }
    .question, .result, .notes {
      background: white;
      border: 1px solid #e4ddd2;
      border-radius: 12px;
      padding: 16px;
      margin-top: 12px;
    }
    .meta { color: #5c564e; font-size: 14px; margin-bottom: 8px; }
    .choices { display: grid; gap: 8px; margin-top: 12px; }
    .choice {
      text-align: left;
      border: 1px solid #e4ddd2;
      border-radius: 10px;
      padding: 12px 14px;
      background: #fff;
      color: #1d1a16;
      font: inherit;
      cursor: pointer;
    }
    .choice.selected { border-color: #0b5f4a; background: #e7f3ef; }
    .choice.right { border-color: #0b5f4a; background: #e7f3ef; }
    .choice.wrong { border-color: #9d1c1c; background: #fbeeee; }
    .choice:disabled { cursor: default; }
    button.submit {
      margin-top: 16px;
      border: 0;
      border-radius: 8px;
      padding: 12px 16px;
      background: #0b5f4a;
      color: white;
      font: inherit;
      cursor: pointer;
    }
    button.submit:disabled { background: #c8c2b8; color: #6d675f; cursor: not-allowed; }
    .result.pass { border-color: #0b5f4a; }
    .result.fail { border-color: #9d1c1c; }
    .explain { margin-top: 8px; color: #3d4a57; }
    .correct-label { color: #0b5f4a; font-weight: 700; }
    .incorrect-label { color: #9d1c1c; font-weight: 700; }
    .answer-detail { margin-top: 14px; line-height: 1.6; }
    .explain { background: #f4f1ea; border-radius: 8px; padding: 12px; line-height: 1.7; }
    .result-action { display: inline-block; margin-top: 24px; padding: 14px 24px; border-radius: 8px; background: #0b5f4a; color: white; text-decoration: none; }
    #status { min-height: 1.4em; margin-top: 12px; color: #5c564e; }
    #status.error { color: #9d1c1c; }
  </style>
</head>
<body>
  <header>
    <h1>개념 확인</h1>
    <p>배운 내용을 세 문제로 확인합니다. 두 문제 이상 맞으면 이 개념을 통과합니다.</p>
  </header>
  <p id="status">문제를 불러오는 중입니다.</p>
  <section id="outcome"></section>
  <main id="quiz"></main>


  <script>
    const params = new URLSearchParams(location.search);
    if(params.get('mode') === 'review') {
      document.querySelector('header h1').textContent='다시 풀기';
      document.querySelector('header p').textContent='이 문제를 다시 풀어 보세요. 최초 풀이 결과는 유지됩니다.';
      const quizEl=document.querySelector('#quiz'), statusEl=document.querySelector('#status');
      const el=(tag,text)=>{const n=document.createElement(tag);n.textContent=text;return n};
      async function reviewFetch(url,options={}) {
        const headers=new Headers(options.headers||{});
        if(typeof window.quizAccessTokenProvider==='function') {const token=await window.quizAccessTokenProvider();if(!token)throw Error('로그인이 필요합니다.');headers.set('Authorization','Bearer '+token)}
        const r=await fetch(url,{...options,headers});const b=await r.json();if(!r.ok)throw Error(b.message||'요청을 처리하지 못했습니다.');return b;
      }
      async function loadReview(){
        try{
          const query=new URLSearchParams({concept_id:params.get('concept_id')||'',filter:'all'});
          if(params.get('stage_id'))query.set('stage_id',params.get('stage_id'));
          const page=await reviewFetch('/api/v1/learning-notes/concepts?'+query);
          const group=page.items.find(g=>g.concept_id===params.get('concept_id')&&(g.stage_id||'')===(params.get('stage_id')||''));
          const question=group?.questions.find(q=>q.submission_id===params.get('submission_id')&&q.question_index===Number(params.get('question_index')));
          if(!question)throw Error('다시 풀 문제를 찾을 수 없습니다. 학습노트에서 다시 선택해 주세요.');
          document.querySelector('header h1').textContent=group.term+' · 다시 풀기';
          statusEl.textContent='Q'+question.question_index+' · '+(question.question_type==='ox'?'OX':'상황형');
          const card=el('article','');card.className='question';card.append(el('h2',question.prompt));
          const choices=el('div','');choices.className='choices';let answer='',sending=false;const key=crypto.randomUUID(),buttons=[];
          const submit=el('button','답안 제출');submit.className='submit';submit.disabled=true;
          for(const choice of question.choices){const b=el('button',choice.key+'. '+choice.text);b.className='choice';b.setAttribute('aria-pressed','false');b.onclick=()=>{if(sending)return;answer=choice.key;buttons.forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',String(x===b))});submit.disabled=false};buttons.push(b);choices.append(b)}
          const result=el('section','');result.setAttribute('role','status');
          submit.onclick=async()=>{sending=true;submit.disabled=true;buttons.forEach(b=>b.disabled=true);statusEl.textContent='복습 결과를 저장하는 중입니다.';
            try{const r=await reviewFetch('/api/v1/learning-notes/submissions/'+encodeURIComponent(question.submission_id)+'/questions/'+question.question_index+'/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answer,idempotency_key:key})});
              result.className='result '+(r.is_correct?'pass':'fail');result.replaceChildren(el('h2',r.is_correct?'정답입니다.':'오답입니다.'),el('p','내 답: '+r.submitted_answer+' / 정답: '+question.answer),el('p',question.explanation));
              statusEl.textContent='복습 기록에 저장했습니다. 최초 정오답과 학습 진행률은 바뀌지 않습니다.';
              submit.hidden=true;
            }catch(e){statusEl.textContent=e.message;submit.disabled=false;sending=false;}
          };
          const back=el('a','학습노트로 돌아가기');back.href='/learning-notes';back.className='result-action';
          card.append(choices,submit);quizEl.replaceChildren(card,result,back);
        }catch(e){statusEl.textContent=e.message;const back=el('a','학습노트로 돌아가기');back.href='/learning-notes';quizEl.replaceChildren(back);}
      }
      loadReview();
    } else {

    const QUIZ_ID = new URLSearchParams(location.search).get("quiz_set_id") || "91862c9e-1780-4395-9b62-f92eddec113d";
    const answers = {};
    let quiz = null;
    let submitted = false;
    let currentIndex = 0;
    const submissionKey = "page-" + crypto.randomUUID();

    async function quizFetch(url, options = {}) {
      const headers = new Headers(options.headers || {});
      if (typeof window.quizAccessTokenProvider === "function") {
        const token = await window.quizAccessTokenProvider();
        if (!token) throw new Error("로그인이 필요합니다.");
        headers.set("Authorization", "Bearer " + token);
      }
      return fetch(url, { ...options, headers });
    }

    const statusEl = document.querySelector("#status");
    const quizEl = document.querySelector("#quiz");
    const outcomeEl = document.querySelector("#outcome");

    function setStatus(message, isError) {
      statusEl.textContent = message;
      statusEl.className = isError ? "error" : "";
    }

    function typeLabel(questionType) {
      return questionType === "ox" ? "참·거짓" : "상황 선택";
    }

    function renderQuiz() {
      quizEl.innerHTML = "";
      [quiz.questions[currentIndex]].forEach((question) => {
        const card = document.createElement("article");
        card.className = "question";
        const meta = document.createElement("p");
        meta.className = "meta";
        meta.textContent = (currentIndex + 1) + " / " + quiz.questions.length + " · " + typeLabel(question.question_type);
        const prompt = document.createElement("h2");
        prompt.textContent = question.prompt;
        const choices = document.createElement("div");
        choices.className = "choices";
        question.choices.forEach((choice) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "choice";
          button.dataset.key = choice.key;
          button.classList.toggle("selected", answers[question.question_index] === choice.key);
          button.setAttribute("aria-pressed", answers[question.question_index] === choice.key ? "true" : "false");
          button.textContent = choice.key + ". " + choice.text;
          button.addEventListener("click", () => selectAnswer(question.question_index, choice.key));
          choices.appendChild(button);
        });
        card.append(meta, prompt, choices);
        quizEl.appendChild(card);
      });
      const submit = document.createElement("button");
      submit.type = "button";
      submit.className = "submit";
      submit.id = "submit";
      const last = currentIndex === quiz.questions.length - 1;
      submit.textContent = last ? "채점 결과 보기" : "다음 문제 →";
      submit.disabled = !answers[quiz.questions[currentIndex].question_index];
      submit.addEventListener("click", () => {
        if (last) {
          submitAnswers();
        } else {
          currentIndex += 1;
          renderQuiz();
        }
      });
      quizEl.appendChild(submit);
    }

    function selectAnswer(questionIndex, key) {
      if (submitted) return;
      answers[questionIndex] = key;
      document.querySelectorAll(".question").forEach((card) => {
        const question = quiz.questions[currentIndex];
        card.querySelectorAll(".choice").forEach((button) => {
          const selected = button.dataset.key === answers[question.question_index];
          button.classList.toggle("selected", selected);
          button.setAttribute("aria-pressed", selected ? "true" : "false");
        });
      });
      document.querySelector("#submit").disabled = false;
    }

    function renderResults(body) {
      document.querySelector("header h1").textContent = "퀴즈 결과";
      document.querySelector("header p").textContent = "문제별 정오답과 해설을 확인하세요.";
      quizEl.innerHTML = "";
      body.results.forEach((item) => {
        const card = document.createElement("article");
        card.className = "question";
        const meta = document.createElement("p");
        meta.className = "meta " + (item.is_correct ? "correct-label" : "incorrect-label");
        meta.textContent = item.question_index + "번 · " + (item.is_correct ? "정답" : "오답");
        const prompt = document.createElement("h2");
        prompt.textContent = item.prompt;
        const question = quiz.questions.find((q) => q.question_index === item.question_index);
        const choiceLabel = (key) => {
          const choice = question.choices.find((c) => c.key === key);
          return choice ? key + ". " + choice.text : key;
        };
        const answer = document.createElement("p");
        answer.className = "answer-detail";
        answer.textContent = "내 답: " + choiceLabel(item.submitted_answer) + " / 정답: " + choiceLabel(item.answer);
        const explanation = document.createElement("p");
        explanation.className = "explain";
        explanation.textContent = "해설 · " + item.explanation;
        card.append(meta, prompt, answer, explanation);
        quizEl.appendChild(card);
      });
      const action = document.createElement("a");
      action.className = "result-action";
      action.textContent = body.is_passed ? "다음 개념 배우기" : "재학습하러 가기";
      action.href = "/?mode=" + (body.is_passed ? "next" : "relearn");
      quizEl.appendChild(action);
      window.scrollTo({top: 0, behavior: "smooth"});
    }

    async function submitAnswers() {
      submitted = true;
      document.querySelector("#submit").disabled = true;
      setStatus("채점하는 중입니다.");
      try {
      const response = await quizFetch("/api/v1/quiz-sets/" + QUIZ_ID + "/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          submitted_answers: quiz.questions.map((question) => ({
            question_index: question.question_index,
            answer: answers[question.question_index]
          })),
          idempotency_key: submissionKey
        })
      });
      const body = await response.json();
      if (!response.ok) {
        submitted = false;
        document.querySelector("#submit").disabled = false;
        setStatus(body.message || "제출하지 못했습니다.", true);
        return;
      }
      const headline = body.is_passed ? "이 개념을 통과했습니다." : "아직 통과하지 못했습니다.";
      outcomeEl.innerHTML = "";
      const result = document.createElement("section");
      result.className = "result " + (body.is_passed ? "pass" : "fail");
      const title = document.createElement("h2");
      title.textContent = headline;
      const detail = document.createElement("p");
      detail.textContent = "3문제 중 " + body.correct_count + "문제를 맞혔습니다.";
      result.append(title, detail);
      outcomeEl.appendChild(result);
      renderResults(body);
      setStatus("");
      } catch (error) {
        submitted = false;
        document.querySelector("#submit").disabled = false;
        setStatus("제출하지 못했습니다. 로그인과 연결 상태를 확인한 뒤 다시 시도하세요.", true);
      }
    }

    async function loadQuiz() {
      try {
      const response = await quizFetch("/api/v1/quiz-sets/" + QUIZ_ID);
      const body = await response.json();
      if (!response.ok) {
        setStatus(body.message || "퀴즈를 불러오지 못했습니다.", true);
        return;
      }
      quiz = body;
      setStatus(quiz.concept_id + " 개념입니다. 보기를 고른 뒤 제출하세요.");
      renderQuiz();
      } catch (error) {
        setStatus("문제를 불러오지 못했습니다. 로그인과 연결 상태를 확인하세요.", true);
      }
    }

    loadQuiz();
  
}
</script>
</body>
</html>
